!
frr version 8.4.4
frr defaults traditional
hostname router-b
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip route 10.40.0.0/24 Null0
!
router bgp 65020
 bgp router-id 10.40.0.2
 neighbor 169.254.100.1 remote-as 65010
 !
 address-family ipv4 unicast
  network 10.40.0.0/24
  neighbor 169.254.100.1 route-map B-IN in
  neighbor 169.254.100.1 route-map B-OUT out
 exit-address-family
exit
!
ip prefix-list B-IN seq 10 permit 10.10.10.0/24
ip prefix-list B-OUT seq 10 permit 10.40.0.0/24
!
route-map B-IN permit 10
 match ip address prefix-list B-IN
exit
!
route-map B-OUT permit 10
 match ip address prefix-list B-OUT
exit
!
end
