!
frr version 8.4.4
frr defaults traditional
hostname router-a
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip route 10.10.10.0/24 Null0
!
router bgp 65010
 bgp router-id 10.10.10.2
 neighbor 10.10.20.3 remote-as 65020
 !
 address-family ipv4 unicast
  network 10.10.10.0/24
  neighbor 10.10.20.3 route-map A-IN in
  neighbor 10.10.20.3 route-map A-OUT out
 exit-address-family
exit
!
ip prefix-list A-IN seq 10 permit 10.40.0.0/24
ip prefix-list A-OUT seq 10 permit 10.10.10.0/24
!
route-map A-IN permit 10
 match ip address prefix-list A-IN
exit
!
route-map A-OUT permit 10
 match ip address prefix-list A-OUT
exit
!
end
