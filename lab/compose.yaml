services:
  router-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-router:1.1
    container_name: router-a
    hostname: router-a
    init: true
    privileged: true
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./frr/router-a/frr.conf:/etc/frr/frr.conf:ro
    networks:
      lan-a:
        ipv4_address: 10.10.10.2
      transit:
        ipv4_address: 10.10.20.2

  router-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-router:1.1
    container_name: router-b
    hostname: router-b
    init: true
    privileged: true
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./frr/router-b/frr.conf:/etc/frr/frr.conf:ro
    networks:
      lan-b:
        ipv4_address: 10.40.0.2
      transit:
        ipv4_address: 10.10.20.3

networks:
  lan-a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

  lan-b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24

  transit:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
